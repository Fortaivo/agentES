services:
  postgres:
    image: postgres:16
    container_name: agentes-postgres
    environment:
      POSTGRES_DB: agentes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentes"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentes-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: agentes-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agentes-api
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agentes
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: agentes-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agentes
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      WORKER_TICK_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  ollama-data:
